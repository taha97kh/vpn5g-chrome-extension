<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تبلیغ — TAHA VPN 5G</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #000000 0%, #0a0a0a 55%, #06231f 100%);
    color: #f1f5f9;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: min(560px, 92vw);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    backdrop-filter: blur(8px);
  }
  .brand { font-size: 15px; color: #94a3b8; margin-bottom: 16px; }
  .ad-media { max-width: 100%; max-height: 300px; border-radius: 14px; margin-bottom: 14px; }
  .ad-text { font-size: 18px; line-height: 2; margin-bottom: 14px; }
  .ad-link {
    display: inline-block; padding: 10px 22px; margin-bottom: 18px;
    background: #2563eb; color: #fff; border-radius: 12px;
    text-decoration: none; font-weight: bold; font-size: 15px;
  }
  .count {
    font-size: 52px; font-weight: bold; color: #00e5cc; line-height: 1.2;
  }
  .count-label { font-size: 13px; color: #94a3b8; margin: 6px 0 14px; }
  .bar { height: 8px; border-radius: 6px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #00e5cc); }
  .status { font-size: 14px; margin-top: 16px; color: #f1f5f9; }
  .close-btn {
    margin-top: 18px; background: rgba(255,255,255,0.07);
    border: 1px solid #263238; color: #f1f5f9;
    padding: 9px 18px; border-radius: 10px; font-size: 13px; cursor: pointer;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">TAHA VPN 5G — تبلیغ</div>
  <img id="adImage" class="ad-media hidden" alt="">
  <div id="adText" class="ad-text"></div>
  <a id="adLink" class="ad-link hidden" href="#" target="_blank" rel="noopener">مشاهده</a>
  <div class="count" id="countNum">۱۰</div>
  <div class="count-label">ثانیه تا شروع اتصال</div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="status" id="statusText">لطفاً تا پایان تبلیغ صبر کنید؛ اتصال بعد از آن شروع می‌شود.</div>
  <button id="closeBtn" class="close-btn">بستن تبلیغ (اتصال شروع نمی‌شود)</button>
</div>
<script src="../lib/constants.js"></script>
<script src="../lib/util.js"></script>
<script src="../lib/ads.js"></script>
<script src="interstitial.js"></script>
</body>
</html>
